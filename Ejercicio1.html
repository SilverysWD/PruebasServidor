<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de la página</title>
</head>
<body>
    <h1>¿Quien eres tu?</h1>
    <script>
        let nombre = window.prompt("Nombre: ");
        let Apellido1 = window.prompt("Primer apellido: ");
        let Apellido2 = window.prompt("Segundo apellido: ");
        document.write("<p>Nombre: "+nombre+"</p>");
        document.write("<p>Primer apellido: "+Apellido1+"</p>");
        document.write("<p>Segundo apellido: "+Apellido2+"</p>");
    </script>
</body>
</html>
